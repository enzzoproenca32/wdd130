<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Blue River Rafting</title>
    <meta name="description"
      content="Contact Blue River Rafting for questions, reservations, and information about our rafting adventures.">
    <meta name="author" content="Enzzo Proença">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-boat.jpg" alt="Blue River Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>
            <div class="contact-details">
                <h2>Blue River Rafting</h2>
                <p>123 River Canyon Road, Salmon, ID 83467</p>
                <p>Phone: (208) 555-0123</p>
                <p>Email: info@blueriverrafting.com</p>
            </div>
        </section>
        <section class="contact-content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5624.740343871147!2d-113.90677111194306!3d45.17960243341945!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbr!4v1790874863984!5m2!1sen!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="contact-form">
                <h2>Send Us a Message</h2>

                <form>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Purpose of Message</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6"></textarea>

                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Blue River Rafting manager">
                    <figcaption>Sarah Miller - General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Blue River Rafting guide">
                    <figcaption>Daniel Brooks - Head Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Blue River Rafting reservation specialist">
                    <figcaption>Emily Carter - Reservation Specialist</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 | Blue River Rafting | Enzzo Proença</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
